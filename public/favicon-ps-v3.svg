<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded Squircle Box (Vert Terrain exact de l'image) -->
  <rect width="512" height="512" rx="140" fill="#1A7B4C" />

  <!-- Icône Ballon de Football en Lignes Blanches Épaisses (Exact image modèle) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cercle Extérieur du Ballon -->
    <circle cx="256" cy="256" r="142" stroke-width="28" />

    <!-- Pentagone Central (Contour Blanc) -->
    <polygon points="256,176 312,216 291,278 221,278 200,216" stroke-width="24" />

    <!-- Lignes Rayonnantes vers le Bord -->
    <line x1="256" y1="176" x2="256" y2="114" stroke-width="24" />
    <line x1="312" y1="216" x2="370" y2="174" stroke-width="24" />
    <line x1="291" y1="278" x2="338" y2="344" stroke-width="24" />
    <line x1="221" y1="278" x2="174" y2="344" stroke-width="24" />
    <line x1="200" y1="216" x2="142" y2="174" stroke-width="24" />
  </g>
</svg>
