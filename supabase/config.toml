# senepay-webhook / senepay-payout-webhook reçoivent des requêtes externes
# (SenePay), jamais un JWT Supabase — sans ceci, le gateway répond 401 avant
# même d'exécuter le code de la fonction. La sécurité de ces endpoints repose
# sur la vérification de signature HMAC (voir index.ts), pas sur le JWT.
[functions.senepay-webhook]
verify_jwt = false

[functions.senepay-payout-webhook]
verify_jwt = false

# Ces fonctions sont appelées par des utilisateurs authentifiés depuis le
# frontend — le JWT reste la première ligne de défense (RLS + rate limit
# ensuite), donc verify_jwt reste à sa valeur par défaut (true).
[functions.senepay-initiate]
verify_jwt = true

[functions.create-gerant]
verify_jwt = true

[functions.chatbot-query]
verify_jwt = true
